---
# Path-based PR labels — consumed by actions/labeler@v6.
#
# Each top-level key is a label name. The match object uses v6
# syntax: `changed-files: [{ any-glob-to-any-file: [...] }]` —
# at least one of the listed globs must match at least one
# changed file. Globs are minimatch (`**`, `*`, `!`); the
# `dot: true` default means leading-dot paths like `.github/`
# match `**` patterns.

# ---------------------------------------------------------------
# Per-domain labels — each dashboard category in macontrol owns
# a corresponding label. Handler/keyboard files use 3-letter
# abbreviations so each glob enumerates them explicitly.
# ---------------------------------------------------------------

'area:apps':
  - changed-files:
      - any-glob-to-any-file:
          - 'internal/domain/apps/**'
          - 'internal/telegram/handlers/apps.go'
          - 'internal/telegram/keyboards/apps.go'
          - 'docs/usage/categories/apps.md'

