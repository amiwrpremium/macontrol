name: labeler

# Apply path-based area labels to every PR. The mapping lives in
# .github/labeler.yml. Runs on pull_request_target so PRs from
# forks can still be labeled (only the workflow file from the
# base branch runs; PR head code never executes).

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

# For pull_request_target events, github.ref resolves to refs/heads/<base>
# (master), which means two simultaneous PRs share a concurrency group and
# the older one's run gets cancelled when the newer one arrives. Use the PR
# number when present so the group is per-PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  label:
    name: apply labels
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/labeler@f27b608878404679385c85cfa523b85ccb86e213 # v6.1.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: true
          dot: true
