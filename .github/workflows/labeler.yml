name: labeler

# Apply path-based area labels to every PR. The mapping lives in
# .github/labeler.yml. Runs on pull_request_target so PRs from
# forks can still be labeled (only the workflow file from the
# base branch runs; PR head code never executes).

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

# For pull_request_target events, github.ref resolves to refs/heads/<base>
# (master), which means two simultaneous PRs share a concurrency group and
# the older one's run gets cancelled when the newer one arrives. Use the PR
# number when present so the group is per-PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  label:
    name: apply labels
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/labeler@b8dd2d9be0f68b860e7dae5dae7d772984eacd6d # v6.2.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: true
          dot: true
