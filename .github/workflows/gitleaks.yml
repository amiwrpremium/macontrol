name: gitleaks

# Scans the repo's git history for accidentally-committed
# secrets — private keys, API tokens, anything matching the
# canonical rule set. macontrol's Telegram bot token lives in
# Keychain and the daemon never writes it to disk, but a leaked
# commit (a paste into a doc, a stray env file, a temp PAT)
# is a separate class of foot-gun that this scan closes.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '37 4 * * 1' # Mondays at 04:37 UTC (weekly diff)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: scan history
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No license key set — uses the OSS edition, which is
          # appropriate for a public repo.
          GITLEAKS_ENABLE_COMMENTS: 'true'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'true'
          GITLEAKS_ENABLE_SUMMARY: 'true'
