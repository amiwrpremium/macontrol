name: auto-assign

# Auto-assign the maintainer as reviewer on every human PR. Bots
# (dependabot, renovate, release-please, github-actions) are
# excluded — their PRs either auto-merge or are reviewed by the
# maintainer directly without needing the assignment.

on:
  pull_request_target:
    types: [opened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

# For pull_request_target events github.ref resolves to refs/heads/<base>,
# so two simultaneous PRs would share a concurrency group. Key on the PR
# number when present.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  assign:
    name: assign reviewers
    if: |
      github.actor != 'dependabot[bot]' &&
      github.actor != 'renovate[bot]' &&
      github.actor != 'release-please[bot]' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: kentaro-m/auto-assign-action@0a2c53d3721e4c5cfcce6afd4014aecc337979f6 # v2.0.2
        with:
          configuration-path: .github/auto_assign.yml
