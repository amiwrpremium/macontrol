name: trufflehog

# TruffleHog: entropy + verifier-based secret scanning. Runs
# alongside gitleaks (regex-based) — two scanners over the same
# surface lower the false-negative rate. `--only-verified` keeps
# signal high: TruffleHog actively tests each detected secret
# against the issuing provider before reporting, so noisy
# entropy hits don't drown the real signal.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '47 4 * * 1'  # Mondays 04:47 UTC — offset from gitleaks (04:37).
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: scan
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # No explicit base/head: the action auto-detects branch for
      # every event type (push, pull_request, workflow_dispatch,
      # schedule). Setting them forces "advanced" mode and bypasses
      # the auto-detect logic. No --fail in extra_args either —
      # the action injects it unconditionally; passing again
      # duplicates the flag.
      - uses: trufflesecurity/trufflehog@37b77001d0174ebec2fcca2bd83ff83a6d45a3ab # v3.95.3
        with:
          extra_args: --only-verified
