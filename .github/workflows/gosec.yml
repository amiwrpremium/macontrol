name: gosec

# Dedicated gosec workflow. golangci-lint already runs gosec on
# every PR via ci.yml — this workflow's only job is to publish
# the findings as SARIF to the GitHub Security tab so they sit
# alongside the CodeQL and Trivy results.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gosec:
    name: gosec security scanner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Gosec
        # gosec releases work like this: maintainers tag e.g.
        # v2.26.1, then push a follow-up commit on master that
        # bumps the bundled gosec binary to that version. Pinning
        # to the post-release master SHA is therefore *newer*
        # than pinning to the tag itself; Renovate / pin-check
        # keep this on the latest such SHA.
        uses: securego/gosec@5eb1d104ef85ff2c905c877eb600e8c1dee33a22 # v2.30.0+1 (master)
        with:
          # G204 is excluded to mirror `.golangci.yml`: subprocess
          # execution via internal/runner is the architectural
          # boundary of this project, not a bug. The rule fires on
          # every call site of the macOS-CLI shell-out path.
          args: '-no-fail -fmt sarif -out gosec.sarif -exclude=G204 ./...'

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        with:
          sarif_file: gosec.sarif
          category: gosec
