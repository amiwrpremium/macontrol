name: gosec

# Dedicated gosec workflow. golangci-lint already runs gosec on
# every PR via ci.yml — this workflow's only job is to publish
# the findings as SARIF to the GitHub Security tab so they sit
# alongside the CodeQL and Trivy results.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gosec:
    name: gosec security scanner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Gosec
        # gosec releases work like this: maintainers tag e.g.
        # v2.26.1, then push a follow-up commit on master that
        # bumps the bundled gosec binary to that version. Pinning
        # to the post-release master SHA is therefore *newer*
        # than pinning to the tag itself; Renovate / pin-check
        # keep this on the latest such SHA.
        uses: securego/gosec@4a3bd8af174872c778439083ded7adbf3747e770 # v2.26.1+1 (master)
        with:
          args: '-no-fail -fmt sarif -out gosec.sarif ./...'

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@95e58e9a2cdfd71adc6e0353d5c52f41a045d225 # v4.35.2
        if: always()
        with:
          sarif_file: gosec.sarif
          category: gosec
