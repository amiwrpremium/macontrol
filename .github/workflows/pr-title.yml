name: PR Title

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - name: Validate
        uses: amannn/action-semantic-pull-request@c5e23b7e584519ee15caa684cf60d056aa9f035f # v6.1.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
          scopes: |
            apps
            battery
            bluetooth
            display
            media
            music
            notify
            power
            sound
            status
            system
            tools
            wifi
            bot
            callbacks
            flows
            handlers
            keyboards
            capability
            config
            keychain
            runner
            version
            daemon
            doctor
            launchd
            service
            setup
            brew
            build
            ci
            deps
            docs
            lint
            release
            repo
            security
            tap
          requireScope: true
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            Subject must start with a lowercase letter.
            Example: feat(sound): add inline keyboard for volume ±
