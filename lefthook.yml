# Optional dev git hooks for macontrol.
#
# Install once:
#   brew install lefthook   # or: go install github.com/evilmartians/lefthook@latest
#   lefthook install        # or: make hooks
#
# Run a hook on demand without committing or pushing:
#   lefthook run pre-commit
#   lefthook run pre-push
#
# Bypass for one commit / push (use sparingly):
#   LEFTHOOK=0 git commit ...
#   LEFTHOOK=0 git push ...
#
# Lefthook is opt-in — CI does not depend on these hooks; they
# exist to catch the same problems locally that ci.yml catches
# remotely, faster.
#
# Tools the hooks need (install via `make tools`):
#   gofumpt       mvdan.cc/gofumpt
#   goimports     golang.org/x/tools/cmd/goimports
#   golangci-lint github.com/golangci/golangci-lint/v2/cmd/golangci-lint
#   govulncheck   golang.org/x/vuln/cmd/govulncheck

min_version: 1.7.0

# ---------------------------------------------------------------------------
# pre-commit — runs on staged files. Cheap, parallel, auto-fix where safe.
# Local mirror of ci.yml's fmt + vet + lint jobs scoped to changed code.
# ---------------------------------------------------------------------------
pre-commit:
  parallel: true
  commands:

    gofumpt:
      tags: format go
      glob: '*.go'
      stage_fixed: true
      run: gofumpt -l -w {staged_files}

    goimports:
      tags: format go
      glob: '*.go'
      stage_fixed: true
      run: |
        files="{staged_files}"
        [ -z "$files" ] && exit 0
        if ! command -v goimports >/dev/null 2>&1; then
          echo "goimports not installed. Run: make tools"
          exit 1
        fi
        bad=$(goimports -l -local github.com/amiwrpremium/macontrol $files)
        if [ -n "$bad" ]; then
          echo "goimports rewrote:"
          echo "$bad"
          goimports -w -local github.com/amiwrpremium/macontrol $bad
          exit 1
        fi

    govet:
      tags: lint go
      glob: '*.go'
      run: |
        files="{staged_files}"
        [ -z "$files" ] && exit 0
        # Vet only the package directories that actually changed.
        pkgs=$(printf '%s\n' $files | xargs -n1 dirname 2>/dev/null \
               | sort -u | sed 's|^|./|')
        [ -z "$pkgs" ] && exit 0
        go vet $pkgs

    golangci-lint:
      tags: lint go
      glob: '*.go'
      run: |
        files="{staged_files}"
        [ -z "$files" ] && exit 0
        if ! command -v golangci-lint >/dev/null 2>&1; then
          echo "golangci-lint not installed. Run: make tools"
          exit 1
        fi
        # --new-from-rev=HEAD shows only issues introduced by the
        # staged change, not pre-existing ones in the same file.
        golangci-lint run --new-from-rev=HEAD --fast

    hygiene:
      tags: hygiene
      run: |
        files="{staged_files}"
        [ -z "$files" ] && exit 0
        rc=0
        for f in $files; do
          [ -f "$f" ] || continue   # deletions
          # Binary files: only check the size guard.
          if file -b --mime-encoding "$f" 2>/dev/null | grep -q binary; then
            size=$(wc -c < "$f")
            if [ "$size" -gt 524288 ]; then
              echo "hygiene: $f is $(($size/1024))KB (> 500KB) — consider Git LFS"
              rc=1
            fi
            continue
          fi
          # 1) Trailing whitespace — skip .md since two trailing
          #    spaces is a hard-line-break marker in Markdown.
          case "$f" in
            *.md) ;;
            *)
              if grep -nE ' +$' "$f"; then
                echo "hygiene: trailing whitespace in $f"; rc=1
              fi ;;
          esac
          # 2) Byte-order mark.
          if head -c 3 "$f" | LC_ALL=C grep -q $'\xef\xbb\xbf'; then
            echo "hygiene: UTF-8 BOM in $f"; rc=1
          fi
          # 3) Merge-conflict markers.
          if grep -nE '^(<<<<<<< |>>>>>>> |=======$)' "$f"; then
            echo "hygiene: merge-conflict markers in $f"; rc=1
          fi
          # 4) Large text files.
          size=$(wc -c < "$f")
          if [ "$size" -gt 524288 ]; then
            echo "hygiene: $f is $(($size/1024))KB (> 500KB)"; rc=1
          fi
        done
        exit $rc

# ---------------------------------------------------------------------------
# commit-msg — enforce Conventional Commits locally so release-please
# (which reads commit titles on master) and the pr-title workflow can't
# reject your work after the fact.
# ---------------------------------------------------------------------------
commit-msg:
  commands:
    conventional:
      run: |
        head -n1 "{1}" | grep -E '^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)\([a-z0-9,-]+\)!?: .+' \
          || { echo "commit message must follow Conventional Commits with required scope (see .gitmessage)"; exit 1; }

# ---------------------------------------------------------------------------
# pre-push — heavyweight pre-flight before code reaches the remote.
# Mirrors ci.yml's required-checks rollup so a green pre-push means CI
# almost certainly passes.
# ---------------------------------------------------------------------------
pre-push:
  parallel: false
  commands:

    build:
      run: go build ./...

    vet:
      run: go vet ./...

    test:
      run: go test -race -count=1 ./...

    govulncheck:
      run: |
        if ! command -v govulncheck >/dev/null 2>&1; then
          echo "govulncheck not installed. Run: make tools"
          exit 1
        fi
        govulncheck ./...
